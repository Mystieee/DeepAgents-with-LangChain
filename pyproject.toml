[project]
name = "deepagents-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mystieee", email = "soabmahira@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.32",
    "ipykernel>=7.4.0",
    "langchain>=1.4.8",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.3",
    "langchain-quickjs>=0.3.11",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
deepagents-course = "deepagents_course:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
